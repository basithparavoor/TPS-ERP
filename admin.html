<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration Suite — THAIBA PUBLIC SCHOOL</title>
  <link rel="icon" type="image/png" href="./tps-logo.png">
  <link rel="apple-touch-icon" href="./tps-logo.png">
  <link rel="stylesheet" href="app.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="ambient-mesh">
    <div class="mesh-glow-1"></div>
    <div class="mesh-glow-2"></div>
  </div>

  <div style="min-height: 100vh; display: flex; flex-direction: column;">
    <!-- Portal Header -->
    <header class="app-topbar">
      <div class="topbar-left">
        <a href="index.html#/dashboard" class="brand-badge" style="padding: 6px 12px; font-size: 0.95rem;">TPS</a>
        <div style="font-family: var(--font-display); font-weight: 700; font-size: 1.1rem;">
          THAIBA PUBLIC SCHOOL — School Administration Portal
        </div>
      </div>
      <div class="topbar-right">
        <a href="index.html#/dashboard" class="btn btn-secondary btn-sm"><i data-lucide="layout-dashboard"></i> Main ERP</a>
        <button class="icon-btn" id="btn-logout" title="Sign Out"><i data-lucide="log-out"></i></button>
      </div>
    </header>

    <div class="app-viewport" id="admin-portal-viewport">
      <!-- Admin module content rendered dynamically -->
    </div>
  </div>

  <script type="module">
    import { AdminModule } from './admin-module.js';
    import { authService } from './auth-service.js';
    import { UIComponents } from './ui-components.js';
    import { TMS_CONFIG } from './config.js';
    import { brandingService } from './branding-service.js';
    import { checkMigration } from './migration-check.js';

    (async () => {
      brandingService.refresh();
      checkMigration();
      await authService.init();
      const user = authService.getCurrentUser();
      const allowed = user && [TMS_CONFIG.roles.ADMIN, TMS_CONFIG.roles.PRINCIPAL].includes(user.role);

      if (!allowed) {
        window.location.href = user ? 'index.html#/dashboard' : 'login.html';
        return;
      }

      UIComponents.initTheme();

      const logoutBtn = document.getElementById('btn-logout');
      if (logoutBtn) logoutBtn.addEventListener('click', () => authService.logout());

      const viewport = document.getElementById('admin-portal-viewport');
      AdminModule.render(viewport);
    })();
  </script>
</body>
</html>
