<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THAIBA PUBLIC SCHOOL — Enterprise Management Suite</title>
  <link rel="icon" type="image/png" href="./tps-logo.png">
  <link rel="apple-touch-icon" href="./tps-logo.png">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#BF9A33">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TPS ERP">
  <link rel="stylesheet" href="app.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div id="app-root">
    <div style="height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 20px; background: #f8fafc;">
      <div class="tms-animated-loader">
        <div class="tms-loader-emblem-wrap" style="position: relative; width: 100px; height: 100px; display: flex; align-items: center; justify-content: center;">
          <div class="tms-loader-aura"></div>
          <img src="tps-logo.png" alt="Thaiba Public School" class="tms-loader-img" style="width: 82px; height: 82px; object-fit: contain; position: relative; z-index: 2;">
        </div>
        <div style="font-family: 'Outfit', sans-serif; font-size: 1.6rem; font-weight: 800; color: #BF9A33; letter-spacing: 0.04em; margin-top: 16px;">
          THAIBA PUBLIC SCHOOL
        </div>
        <p class="tms-loader-text" style="color: #64748b; font-size: 0.88rem; margin: 0;">Initializing Campus Enterprise Platform...</p>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration skipped:', err));
      });
    }
  </script>
</body>
</html>
